[tools]
actionlint = "1.7.12"
"aqua:owenlamont/ryl" = "0.22.0"
aube = "2.3.0"
hk = "2.4.0"
node = "24.21.0"
"npm:oxlint" = { depends = "aube", "version" = "1.86.0" }
oxfmt = { depends = "aube", "version" = "0.71.0" }
rumdl = "0.2.78"
# actionlint runs shellcheck over workflow run: scripts
shellcheck = "0.11.0"
tombi = "1.7.1"
typos = "1.50.3"

[env]
# rollup records the real path of each bundled file in dist/index.js.map, so a
# flat npm-style node_modules keeps it identical to an npm build and free of
# aube's store paths
AUBE_NODE_LINKER = "hoisted"

[task_config]
includes = ["tasks"]

[tasks.check]
run = "hk check --no-fail-fast"

[tasks.check-pr]
run = "hk check --from-ref origin/main --to-ref HEAD --no-fail-fast"

[tasks.check-all]
run = "hk check --all --no-fail-fast"

[tasks.fix]
run = "hk fix --no-fail-fast"

[tasks.fix-pr]
run = "hk fix --from-ref origin/main --to-ref HEAD --no-fail-fast"

[tasks.fix-all]
run = "hk fix --all --no-fail-fast"

[tasks.typecheck]
description = "Type checks the action source"
run = "aube exec tsc --noEmit"

[tasks.test]
description = "Runs the unit tests with coverage"
env = { NODE_OPTIONS = "--experimental-vm-modules", NODE_NO_WARNINGS = "1" }
run = "aube exec jest"

[tasks.coverage]
description = "Updates the coverage badge from the last test run"
depends = ["test"]
run = "aube exec make-coverage-badge --output-path ./badges/coverage.svg"

[tasks.package]
description = "Bundles the action into dist/"
run = [
  "rm -rf dist",
  "aube exec rollup --config rollup.config.ts --configPlugin @rollup/plugin-typescript",
]

[tasks.local-action]
description = "Runs the action locally with inputs from .env"
run = "aube exec local-action . src/main.ts .env"

[tasks.all]
description = "Fixes, tests and bundles everything, ready to commit"
run = [{ task = "fix-all" }, { tasks = ["typecheck", "coverage"] }, { task = "package" }]

[tasks.ci]
description = "Runs all CI checks - lint, type check and test"
depends = ["check-auto", "typecheck", "test"]

[settings]
# deps is experimental
experimental = true

# Installs node modules before `mise run` whenever package.json or
# package-lock.json change. aube reads and writes package-lock.json, which only
# the npm provider recognises, so it runs aube in place of npm
[deps.npm]
auto = true
run = "aube install --frozen-lockfile"
