name: Test Reports
description: An opinionated test reporter for GitHub Actions
author: Callum Kerson

branding:
  icon: check-circle
  color: green

inputs:
  milliseconds:
    description: How long to wait, in milliseconds
    required: true
    default: '1000'

outputs:
  time:
    description: The time the wait finished

runs:
  using: node24
  main: dist/index.js
