name: CI

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install tooling
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      # Keep going when one check fails, so every check writes its report
      - run: mise run --continue-on-error ci
      # Committed dist/ is the last release's build, so report with this
      # branch's code instead
      - if: ${{ !cancelled() }}
        run: mise run package
      - name: Report hk and jest results with this action
        if: ${{ !cancelled() }}
        uses: ./
