name: CI

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install tooling
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      # Keep going when one check fails, so every check writes its report
      - run: mise run --continue-on-error ci
      # Committed dist/ is the last release's build, so report with this
      # branch's code instead. That build is only in the workspace, so this
      # step needs ./ rather than the self-repository $/, which loads the
      # committed dist/
      - if: ${{ !cancelled() }}
        run: mise run package
      - name: Report hk and jest results with this action
        if: ${{ !cancelled() }}
        uses: ./ # zizmor: ignore[self-repository]

  # Checks on a real runner that each leg of a matrix gets its own statuses,
  # from the matrix default in action.yaml that no unit test can evaluate
  matrix-names:
    name: matrix-names (${{ matrix.leg }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    strategy:
      matrix:
        leg: [a, b]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tooling
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: mise run package
      - name: Write a passing report
        run: |
          mkdir -p reports
          echo '<testsuite name="matrix"><testcase name="passes"/></testsuite>' > reports/matrix.junit.xml
      # ./ runs the build from the step above, as in the ci job
      - uses: ./ # zizmor: ignore[self-repository]
      - name: Check the status is named after the matrix leg
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CONTEXT: Tests (${{ matrix.leg }}) / matrix
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$SHA/statuses" --jq '.[].context' |
            grep -Fqx "$CONTEXT" || {
            echo "::error::No commit status named '$CONTEXT'"
            exit 1
          }
