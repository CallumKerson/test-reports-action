name: Main Build

on:
  push:
    branches: ['main']

permissions:
  contents: read

# One run at a time so release-please never races itself. A newer push replaces a
# still-pending run, which loses nothing: release-please reads the whole history.
concurrency:
  group: ${{ github.workflow }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install tooling
        uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
      - run: mise run ci

  # Releases go through the release GitHub App rather than GITHUB_TOKEN, whose pushes and PRs
  # trigger no workflows, so CI would never run on the release PR
  release-please:
    runs-on: ubuntu-latest
    needs: ci
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      major: ${{ steps.release.outputs.major }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          config-file: .config/release-please-config.json
          manifest-file: .config/release-please-manifest.json
          token: ${{ steps.app-token.outputs.token }}

  # dist/ on main is the latest release's build. It changes only through the release PR, so
  # merging that PR ships the bundle together with the version bump and changelog.
  release-pr-dist:
    runs-on: ubuntu-latest
    needs: release-please
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Find the release PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          branch=$(gh pr list --state open --label 'autorelease: pending' \
            --json headRefName --jq '.[0].headRefName // empty')
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.pr.outputs.branch != '' }}
        with:
          ref: ${{ steps.pr.outputs.branch }}
          persist-credentials: false
      - name: Install tooling
        if: ${{ steps.pr.outputs.branch != '' }}
        uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
      - if: ${{ steps.pr.outputs.branch != '' }}
        run: mise run package
      - name: Create release app token
        if: ${{ steps.pr.outputs.branch != '' }}
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      # Committed through the API as the app, so the commit is verified and CI runs on it
      - name: Commit dist/ to the release PR
        if: ${{ steps.pr.outputs.branch != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: ./.github/scripts/commit-dist.sh

  # Actions are used by major version, e.g. `@v1`, which release-please does not move
  tag-major-version:
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pushes the tag
          persist-credentials: true
      - name: Move the major version tag
        env:
          MAJOR: ${{ needs.release-please.outputs.major }}
          SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          git tag --force "v$MAJOR" "$SHA"
          git push --force origin "v$MAJOR"
