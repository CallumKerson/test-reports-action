# `uses:` runs the committed dist/index.js, which is the latest release's build
# of src/. Only the release PR updates it, so this checks that the release PR's
# dist/ matches a fresh `mise run package`, and that no other PR touches dist/.
name: Check dist

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-dist:
    name: check-dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check dist/ is unchanged
        if: ${{ !startsWith(github.head_ref, 'release-please--') }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if ! git diff --quiet "origin/$BASE_REF...HEAD" -- dist/; then
            echo "::error::dist/ is only updated by the release PR, revert the changes to it"
            exit 1
          fi
      - name: Install tooling
        if: ${{ startsWith(github.head_ref, 'release-please--') }}
        uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
      - name: Compare dist/
        id: diff
        if: ${{ startsWith(github.head_ref, 'release-please--') }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: mise run check-dist
      - name: Upload expected dist/
        if: ${{ failure() && steps.diff.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
