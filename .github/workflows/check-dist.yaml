# `uses:` runs the committed dist/index.js, which is the latest release's build
# of src/. Only the release PR updates it, so this checks that the release PR's
# dist/ matches a fresh `mise run package`, and that no other PR touches dist/.
name: Check dist

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-dist:
    name: check-dist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Run directly, as it needs only git and so no tooling install
      - name: Check dist/ is unchanged
        if: ${{ !startsWith(github.head_ref, 'release-please--') }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: ./tasks/check-dist-unchanged
      - name: Install tooling
        if: ${{ startsWith(github.head_ref, 'release-please--') }}
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - name: Compare dist/
        id: diff
        if: ${{ startsWith(github.head_ref, 'release-please--') }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: mise run check-dist
      - name: Upload expected dist/
        if: ${{ failure() && steps.diff.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
