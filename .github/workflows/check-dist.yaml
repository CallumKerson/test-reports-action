# `uses:` runs the committed dist/index.js, which is bundled from src/. This
# fails if the committed dist/ does not match a fresh `mise run package`.
name: Check dist

on:
  pull_request:
  push:
    branches: ['main']
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-dist:
    name: check-dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tooling
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: mise run package
      - name: Compare dist/
        id: diff
        run: |
          if [ -n "$(git status --porcelain dist/)" ]; then
            echo "dist/ is out of date, run 'mise run package' and commit:"
            git diff --text dist/
            exit 1
          fi
      - name: Upload expected dist/
        if: ${{ failure() && steps.diff.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
